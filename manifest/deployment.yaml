apiVersion: apps/v1
kind: Deployment
metadata:
  namespace: gateway
  name: webapp
spec:
  replicas: 2
  selector:
    matchLabels:
      app: webapp
  template:
    metadata:
      name: webapp
      labels:
        app: webapp
    spec:
      containers:
      - name: webapp-container
        image: 999568710647.dkr.ecr.us-west-2.amazonaws.com/webapp:1.14.0
        ports:
        - containerPort: 8080
        env:
        - name: DB_URL
          value: "jdbc:postgresql://fusisoft-db.c5e0wyqgew1t.us-west-2.rds.amazonaws.com:5432/contact"
        - name: DB_USER
          valueFrom:
            secretKeyRef:
              name: db-credentials
              key: username
        - name: DB_PASSWORD
          valueFrom:
            secretKeyRef:
              name: db-credentials
              key: password
